<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 810" role="img" aria-labelledby="title desc"><title id="title">Comatching5 · 서비스 분리 구조</title><desc id="desc">HTTP로 요청을 연결하고 Kafka 이벤트로 후속 작업을 전달</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#475569"/></marker></defs><style>text{font-family:Pretendard,system-ui,sans-serif;fill:#172033}.name{font-size:19px;font-weight:650}.sub{font-size:14px;fill:#475569}</style><rect width="760" height="810" rx="20" fill="#f1f5f9"/><text x="32" y="43" font-size="24" font-weight="700">Comatching5 · 서비스 분리 구조</text><text x="32" y="70" class="sub">HTTP로 요청을 연결하고 Kafka 이벤트로 후속 작업을 전달</text><rect x="220" y="100" width="320" height="84" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="240" y="132" class="name">Next.js 웹 클라이언트</text><text x="240" y="158" class="sub">매칭 · 아이템 · 실시간 채팅</text><path d="M380 184 L380 225" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="220" y="225" width="320" height="84" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="240" y="257" class="name">API Gateway</text><text x="240" y="283" class="sub">인증 검증 · 서비스별 라우팅</text><path d="M300 309 L145 355" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M380 309 L380 355" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M460 309 L615 355" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="355" width="220" height="84" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="50" y="387" class="name">User</text><text x="50" y="413" class="sub">회원 · 프로필</text><rect x="270" y="355" width="220" height="84" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="290" y="387" class="name">Matching</text><text x="290" y="413" class="sub">후보 조회 · 매칭</text><rect x="510" y="355" width="220" height="84" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="530" y="387" class="name">Item</text><text x="530" y="413" class="sub">아이템 사용 · 복구</text><path d="M380 439 L380 485" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="390" y="452" text-anchor="start" class="sub">매칭 성공 이벤트</text><rect x="270" y="485" width="220" height="84" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="290" y="517" class="name">Kafka</text><text x="290" y="543" class="sub">서비스 간 이벤트</text><path d="M270 527 L250 595" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M490 527 L510 595" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="595" width="300" height="84" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="50" y="627" class="name">Chat</text><text x="50" y="653" class="sub">MongoDB 저장 · Redis Pub/Sub</text><rect x="430" y="595" width="300" height="84" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="450" y="627" class="name">Notification</text><text x="450" y="653" class="sub">채팅 알림 이벤트 · FCM</text><rect x="30" y="715" width="700" height="65" rx="12" fill="#dbeafe"/><text x="50" y="743" class="name">관계형 데이터: MySQL / RDS · 동시성 제어: Redis</text><text x="50" y="766" class="sub">Gateway는 Chat·Notification에도 라우팅 · 서비스 간 조회/아이템 처리는 Feign 사용</text></svg>
