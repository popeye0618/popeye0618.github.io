<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 825" role="img" aria-labelledby="title desc"><title id="title">Harucut · 이미지 합성과 복구 구조</title><desc id="desc">작업을 먼저 저장하고, 비동기 실행 결과를 반영</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#475569"/></marker></defs><style>text{font-family:Pretendard,system-ui,sans-serif;fill:#172033}.name{font-size:19px;font-weight:650}.sub{font-size:14px;fill:#475569}</style><rect width="760" height="825" rx="20" fill="#f1f5f9"/><text x="32" y="43" font-size="24" font-weight="700">Harucut · 이미지 합성과 복구 구조</text><text x="32" y="70" class="sub">작업을 먼저 저장하고, 비동기 실행 결과를 반영</text><rect x="30" y="100" width="300" height="84" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="50" y="132" class="name">웹 클라이언트</text><text x="50" y="158" class="sub">사진 4장 업로드 · 작업 상태 조회</text><rect x="430" y="100" width="300" height="84" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="450" y="132" class="name">Amazon S3</text><text x="450" y="158" class="sub">원본 · 프레임 · 결과 · 썸네일</text><path d="M330 142 L430 142" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="380" y="132" text-anchor="middle" class="sub">직접 업로드</text><path d="M180 184 L180 260" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="190" y="212" text-anchor="start" class="sub">합성 요청 / 상태 조회</text><rect x="30" y="260" width="300" height="84" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="50" y="292" class="name">Spring Boot API</text><text x="50" y="318" class="sub">소유권 검증 · 작업 생성</text><path d="M330 302 L430 302" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="430" y="260" width="300" height="84" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="450" y="292" class="name">MySQL · ComposeJob</text><text x="450" y="318" class="sub">PENDING → DONE / FAILED</text><path d="M180 344 L180 445" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="190" y="384.5" text-anchor="start" class="sub">커밋 후 선점 · 비동기 호출</text><rect x="30" y="445" width="300" height="84" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="50" y="477" class="name">AWS Lambda</text><text x="50" y="503" class="sub">이미지 합성 · S3 결과 저장</text><path d="M330 487 L430 487" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="380" y="477" text-anchor="middle" class="sub">실행 결과</text><rect x="430" y="445" width="300" height="84" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="450" y="477" class="name">Amazon SQS</text><text x="450" y="503" class="sub">Lambda 성공 / 실패 통지</text><path d="M580 529 L580 600" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="590" y="554.5" text-anchor="start" class="sub">백엔드가 long polling</text><rect x="430" y="600" width="300" height="84" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="450" y="632" class="name">결과 소비자</text><text x="450" y="658" class="sub">DB 반영 후 메시지 삭제</text><rect x="30" y="600" width="300" height="84" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="50" y="632" class="name">복구 스케줄러</text><text x="50" y="658" class="sub">정체된 PENDING 작업 재선점</text><path d="M180 600 L180 529" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="190" y="554.5" text-anchor="start" class="sub">재실행</text><path d="M730 642 H745 V365 H580 V344" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="725" width="700" height="70" rx="12" fill="#dbeafe"/><text x="50" y="754" class="name">완료는 작업 상태로 확인 · 결과 반영 실패는 재전달</text><text x="50" y="779" class="sub">복구 기본값: 30초 주기 / 10분 이상 정체 · Redis는 인증 데이터에 사용</text></svg>
